const state={user:null,manga:[],shelf:[],people:[],members:[],mutes:[],feedback:[],rooms:[],siteBackground:null,appliedBackgroundKey:'',page:'discover',genre:'All',shelfStatus:'All',room:'general',activePerson:null,conversationId:null,query:'',reviews:[],feedbackAlerts:[],feedbackBarDismissed:false,source:null};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>String(s||'?').slice(0,1).toUpperCase();
const colors=m=>(m.palette||'#c84736|#d9a46b|#51404a').split('|');
const fmtDate=s=>{try{return new Date(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}catch{return ''}};
const SITE_BACKGROUND_PRESETS={
 street:{light:"linear-gradient(rgba(245,242,236,.76),rgba(245,242,236,.76)),url('/assets/street-background.jpg')",dark:"linear-gradient(rgba(21,25,23,.78),rgba(21,25,23,.78)),url('/assets/street-background.jpg')"},
 sakura:{light:"linear-gradient(140deg,rgba(250,207,222,.78),rgba(255,245,237,.84)),url('/assets/street-background.jpg')",dark:"linear-gradient(140deg,rgba(57,29,46,.88),rgba(34,31,37,.90)),url('/assets/street-background.jpg')"},
 sunset:{light:"linear-gradient(140deg,rgba(255,212,157,.74),rgba(241,142,126,.68)),url('/assets/street-background.jpg')",dark:"linear-gradient(140deg,rgba(77,42,35,.88),rgba(52,34,39,.91)),url('/assets/street-background.jpg')"},
 ocean:{light:"linear-gradient(140deg,rgba(178,220,224,.80),rgba(155,183,207,.78)),url('/assets/street-background.jpg')",dark:"linear-gradient(140deg,rgba(25,53,62,.88),rgba(29,42,58,.92)),url('/assets/street-background.jpg')"},
 midnight:{light:"linear-gradient(140deg,rgba(125,142,179,.76),rgba(201,186,213,.78)),url('/assets/street-background.jpg')",dark:"linear-gradient(140deg,rgba(20,26,48,.92),rgba(38,30,55,.93)),url('/assets/street-background.jpg')"}
};
function applyEventBackground(settings={background:'street',transition_ms:3000},animate=true,force=false){const root=$('#site-background');if(!root)return;const custom=settings?.background==='custom'&&settings?.custom_available&&Boolean(settings?.image_url),background=custom?'custom':SITE_BACKGROUND_PRESETS[settings?.background]?settings.background:'street',dark=document.documentElement.dataset.theme==='dark',imgUrl=settings?.image_url||'/api/site-background-image',key=`${background}:${dark?'dark':'light'}:${custom?imgUrl:''}`;if(key===state.appliedBackgroundKey&&!force)return;const layers=$$('.site-background-layer',root),active=layers.findIndex(layer=>layer.classList.contains('is-active')),next=active===0?1:0;root.style.setProperty('--background-fade',`${animate?Math.max(0,Number(settings?.transition_ms)||3000):0}ms`);layers[next].style.backgroundImage=custom?`${dark?'linear-gradient(rgba(21,25,23,.62),rgba(21,25,23,.62))':'linear-gradient(rgba(245,242,236,.56),rgba(245,242,236,.56))'},url("${imgUrl}")`:SITE_BACKGROUND_PRESETS[background][dark?'dark':'light'];if(active<0){layers[next].classList.add('is-active')}else{layers[active].classList.remove('is-active');void layers[next].offsetWidth;layers[next].classList.add('is-active')}state.appliedBackgroundKey=key}
function applyTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';localStorage.setItem('panel-wars-theme',dark?'dark':'light');const button=$('#theme-toggle');if(button){button.innerHTML=dark?'☀ <span>Light theme</span>':'☾ <span>Dark theme</span>';button.setAttribute('aria-label',`Switch to ${dark?'light':'dark'} mode`);button.setAttribute('aria-pressed',String(dark))}applyEventBackground(state.siteBackground||{background:'street',transition_ms:3000},true)}
function notify(msg){const root=$('#toast-root');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>root.innerHTML='',2800)}
function showChatWarning(message){const host=$('#overlay-root');host.innerHTML=`<div class="overlay" id="chat-warning-overlay"><section class="auth-card chat-warning-card" role="alertdialog" aria-modal="true" aria-labelledby="chat-warning-title" aria-describedby="chat-warning-copy"><img class="chat-warning-image" src="/assets/chat-warning-cat.png" alt="A cat making a shushing gesture"><div class="eyebrow">Community reminder</div><h2 id="chat-warning-title">Keep the chat respectful</h2><p id="chat-warning-copy">${esc(message)}</p><button class="btn" id="chat-warning-close" type="button">I understand</button></section></div>`;$('#chat-warning-close').onclick=()=>{host.innerHTML=''};$('#chat-warning-close').focus()}
function renderFeedbackAlerts(){const bar=$('#staff-alert-bar'),bell=$('#staff-bell'),badge=$('#staff-bell-badge');if(!bar)return;const allowed=['owner','admin'].includes(state.user?.role),pending=(state.feedback||[]).filter(item=>!item.handled_at).length;if(bell)bell.hidden=!allowed;if(badge){badge.textContent=pending>99?'99+':String(pending);badge.hidden=!allowed||pending===0}if(!allowed||!state.feedbackAlerts.length||state.feedbackBarDismissed){bar.hidden=true;return}const latest=state.feedbackAlerts[0],category={suggestion:'suggestion',bug:'problem report',other:'feedback'}[latest.category]||'feedback';$('#staff-alert-text').textContent=`${latest.username} sent a ${category}. Open the inbox to review it.`;$('#staff-alert-count').textContent=`${pending} open`;bar.hidden=false}
function receiveFeedbackAlert(feedback){if(!['owner','admin'].includes(state.user?.role))return;state.feedback.unshift(feedback);state.feedback=state.feedback.slice(0,100);state.feedbackAlerts.unshift(feedback);state.feedbackAlerts=state.feedbackAlerts.slice(0,99);state.feedbackBarDismissed=false;renderFeedbackAlerts();if(state.page==='discover')renderPage()}
function dismissFeedbackAlerts(){state.feedbackBarDismissed=true;renderFeedbackAlerts()}
function receiveFeedbackHandled(id,handledAt){const item=state.feedback.find(entry=>entry.id===id);if(item)item.handled_at=handledAt;state.feedbackAlerts=state.feedbackAlerts.filter(entry=>entry.id!==id);renderFeedbackAlerts();if(['discover','manage'].includes(state.page))renderPage()}
async function handleFeedback(id){const button=$(`[data-feedback-handle="${id}"]`);if(button)button.disabled=true;try{const result=await api('/api/feedback/handle',{method:'POST',body:JSON.stringify({feedback_id:id})});const item=state.feedback.find(entry=>entry.id===id);if(item)item.handled_at=result.handled_at;state.feedbackAlerts=state.feedbackAlerts.filter(entry=>entry.id!==id);renderFeedbackAlerts();renderPage();notify('Feedback marked handled.')}catch(error){notify(error.message);if(button)button.disabled=false}}
function openFeedbackInbox(){state.feedbackBarDismissed=false;renderFeedbackAlerts();go('discover');setTimeout(()=>$('#feedback-inbox')?.scrollIntoView({behavior:'smooth',block:'start'}),60)}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Could not complete that request.');return data}
async function refresh(){const d=await api('/api/bootstrap');Object.assign(state,d);applyEventBackground(state.siteBackground,false);state.feedbackAlerts=['owner','admin'].includes(state.user?.role)?(d.feedback||[]).filter(item=>!item.handled_at):[];state.feedbackBarDismissed=false;renderPage();if(state.user)connectStream();else if(state.source){state.source.close();state.source=null;showAuth()}}
function connectStream(){if(state.source)state.source.close();state.source=new EventSource('/api/stream');state.source.onmessage=e=>{try{const v=JSON.parse(e.data);if(v.type==='site_background_changed'){state.siteBackground=v.settings;applyEventBackground(v.settings,true,true)}if(v.type==='chat_message_removed')removeRoomMessage(v.message_id,v.room_id);if(v.type==='room_message'&&v.message.room_id===state.room&&state.page==='chat')appendRoom(v.message);if(v.type==='direct_message'&&state.page==='community'&&v.message.conversation_id===state.conversationId)appendDM(v.message);if(v.type==='chat_language_alert')notify(`Chat alert: ${v.username} was blocked for inappropriate language in ${v.room_name}.`);if(v.type==='feedback_submitted')receiveFeedbackAlert(v.feedback);if(v.type==='feedback_handled')receiveFeedbackHandled(v.feedback_id,v.handled_at);if(v.type==='account_banned'){state.source.close();state.source=null;state.user=null;refresh();notify('This account has been banned.')}}catch{}};state.source.onerror=()=>{}}
function canManageRoles(role){return ['owner','admin','community_moderator'].includes(role)}
function canEditCatalogue(role){return ['owner','editor'].includes(role)}
function roleName(role){return String(role||'reader').replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase())}
function go(page){state.page=page;state.query='';$('#search').value='';$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const labels={discover:['DISCOVER / FICTIONAL LIBRARY','Discover'],shelf:['YOUR CORNER / LIBRARY','Library'],chat:['THE LOUNGE / LIVE CHAT','Live chat'],community:['THE COMMUNITY / READERS','Readers'],manage:['COMMUNITY / MEMBER ROLES','Roles']};$('#crumb').textContent=labels[page][0];renderPage()}
function renderPage(){const root=$('#content');if(!state.user&&state.page!=='discover'){renderAuthGate(root);renderProfile();return}if(state.page==='discover')renderDiscover(root);if(state.page==='shelf')renderShelf(root);if(state.page==='chat')renderChat(root);if(state.page==='community')renderCommunity(root);if(state.page==='manage'){if(canManageRoles(state.user?.role))renderMemberManagement(root);else renderAuthGate(root)}renderProfile()}
function renderAuthGate(root){const labels={shelf:['Your library','Sign in to save a manga shelf and keep your chapter progress.'],chat:['Join the live room','Sign in to chat with manga readers in real time.'],community:['Meet the readers','Sign in to start a private conversation with a reader or moderator.']},[title,description]=labels[state.page]||labels.shelf;root.innerHTML=`<section class="auth-card" style="margin:28px auto;box-shadow:none;border:1px solid var(--line)"><div class="eyebrow">A reader account unlocks this corner</div><h2>${esc(title)}</h2><p>${esc(description)}</p><button class="btn" id="gate-signin">Sign in</button><button class="auth-switch" id="gate-register" style="display:block">New here? Create an account</button></section>`;$('#gate-signin').onclick=()=>showAuth('login');$('#gate-register').onclick=()=>showAuth('register')}
function closeSettings(){const menu=$('#settings-menu'),button=$('#settings-button');if(menu)menu.hidden=true;if(button)button.setAttribute('aria-expanded','false')}
async function signOut(){try{await api('/api/logout',{method:'POST',body:'{}'});state.source?.close();state.source=null;state.user=null;await refresh();closeSettings();notify('Signed out.')}catch(e){notify(e.message)}}
function renderProfile(){renderFeedbackAlerts();const eventButton=$('#event-open');if(eventButton)eventButton.hidden=state.user?.role!=='owner';const account=$('#settings-account');if(account){account.textContent=state.user?'↗  Sign out':'↗  Sign in';account.setAttribute('aria-label',state.user?'Sign out':'Sign in');account.onclick=()=>{closeSettings();if(state.user)signOut();else showAuth('login')}}const manage=$('#manage-nav');if(manage)manage.hidden=!canManageRoles(state.user?.role);const el=$('#profile-mini');el.hidden=!state.user;if(!state.user){el.innerHTML='';return}el.innerHTML=`<div class="avatar">${short(state.user.username)}</div><div><div class="profile-name">${esc(state.user.username)}</div><div class="profile-role">${esc(roleName(state.user.role))}</div></div><button title="Sign out" aria-label="Sign out" id="logout">↗ <span>Sign out</span></button>`;$('#logout').onclick=signOut}
function feedbackInboxHTML(){if(!['owner','admin'].includes(state.user?.role))return '';const feedback=state.feedback||[];return `<section id="feedback-inbox" style="margin-top:34px;scroll-margin-top:110px"><div class="sectionbar"><div><div class="eyebrow">Reader notes</div><h2>Feedback inbox</h2></div><span class="crumb">${feedback.filter(item=>!item.handled_at).length} OPEN · ${feedback.length} TOTAL</span></div><div class="feedback-list">${feedback.length?feedback.map(item=>`<article class="feedback-item"><div class="feedback-meta"><b>${esc(item.username)}</b><span class="role-badge">${esc(roleName(item.category))}</span><small>${fmtDate(item.created_at)}</small><button class="feedback-handle" data-feedback-handle="${item.id}" type="button" ${item.handled_at?'disabled':''}>${item.handled_at?'Handled':'Mark handled'}</button></div><p>${esc(item.message)}</p></article>`).join(''):'<div class="empty">No feedback yet.</div>'}</div></section>`}
function renderMemberManagement(root){const members=state.members||[],actor=state.user.role,modRoles=['community_moderator','room_moderator'];const choicesFor=m=>{if(actor==='owner')return m.role==='owner'?[]:['reader','room_moderator','community_moderator','editor','admin'];if(actor==='admin'&&(modRoles.includes(m.role)||m.role==='reader'))return ['reader','room_moderator','community_moderator'];if(actor==='community_moderator'&&(m.role==='room_moderator'||m.role==='reader'))return ['reader','room_moderator'];return []};const title=actor==='owner'?'Owner controls':actor==='admin'?'Moderator assignments':'Room moderator assignments';const policy=actor==='owner'?'Promote or demote staff, ban or mute accounts, and manage the fictional library. Owner accounts stay protected.':actor==='admin'?'Promote or demote community and room moderators. Admin accounts and other roles are protected.':'Promote readers to room moderators or demote room moderators back to readers.';root.innerHTML=`<div class="page-head"><div><div class="eyebrow">Staff controls</div><h1>${title}</h1><p>${esc(policy)}</p></div><span class="crumb">${members.length} ACCOUNTS</span></div><div class="owner-notice">${esc(policy)} Role changes are enforced by the server.</div><label for="member-search" style="display:block;margin:0 0 12px;font-size:11px;color:var(--muted)">Search users by name or role<input id="member-search" type="search" placeholder="Search usernames or roles…" autocomplete="off" style="display:block;width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)"></label><div id="member-count" class="crumb" style="display:inline-block;margin-bottom:9px">${members.length} ACCOUNTS</div><div class="members-list">${members.length?members.map(m=>{const choices=choicesFor(m);if(!choices.includes(m.role))choices.push(m.role);const protectedUser=m.role==='owner'||m.id===state.user.id,disabled=protectedUser||choices.length===1;const globalMute=(state.mutes||[]).some(x=>x.user_id===m.id&&x.room_id==='*');const status=m.banned_at?' · BANNED':'';return `<div class="member-row" data-search="${esc((m.username+' '+m.role).toLowerCase())}"><div class="member-identity"><div class="avatar">${short(m.username)}</div><div><b>${esc(m.username)}${m.id===state.user.id?' · you':''}</b><small>${esc(roleName(m.role))}${m.created_at?' · joined '+fmtDate(m.created_at):''}${status}</small></div></div><select class="role-select" data-role-choice="${m.id}" ${disabled?'disabled':''} aria-label="Role for ${esc(m.username)}">${choices.map(role=>`<option value="${role}" ${m.role===role?'selected':''}>${role.replaceAll('_',' ').replace(/\b\w/g,x=>x.toUpperCase())}</option>`).join('')}</select><div class="member-actions">${!disabled?`<button class="member-save" data-role-save="${m.id}">Save role</button>`:''}${actor==='owner'&&!protectedUser?`<button class="member-action" data-member-ban="${m.id}" data-banned="${!!m.banned_at}">${m.banned_at?'Unban':'Ban'}</button><button class="member-action" data-member-mute="${m.id}" data-muted="${globalMute}">${globalMute?'Unmute':'Mute all 1h'}</button>`:''}</div></div>`}).join(''):'<div class="empty">No member accounts yet.</div>'}</div><div id="member-no-results" class="empty" style="display:none">No users match that search.</div>`;root.innerHTML+=feedbackInboxHTML();const memberSearch=$('#member-search',root);memberSearch.oninput=()=>{const query=memberSearch.value.trim().toLowerCase();let visible=0;$$('.member-row',root).forEach(row=>{const match=row.dataset.search.includes(query);row.style.display=match?'':'none';if(match)visible++});const noResults=$('#member-no-results',root);noResults.style.display=query&&visible===0?'':'none';$('#member-count',root).textContent=query?`${visible} MATCH${visible===1?'':'ES'}`:`${members.length} ACCOUNTS`};$$('[data-role-save]',root).forEach(button=>button.onclick=async()=>{const id=Number(button.dataset.roleSave),select=$(`[data-role-choice="${id}"]`,root),member=members.find(m=>m.id===id);if(!select||!member||select.value===member.role)return;button.disabled=true;try{await api('/api/users/role',{method:'POST',body:JSON.stringify({user_id:id,role:select.value})});await refresh();notify(`${member.username} is now ${select.value.replaceAll('_',' ')}.`)}catch(e){notify(e.message);button.disabled=false}});$$('[data-member-ban]',root).forEach(button=>button.onclick=async()=>{const id=Number(button.dataset.memberBan),member=members.find(m=>m.id===id),banned=button.dataset.banned==='true';if(!banned&&!confirm(`Ban ${member.username}? They will be signed out and unable to log in.`))return;button.disabled=true;try{await api('/api/users/ban',{method:'POST',body:JSON.stringify({user_id:id,banned:!banned,reason:'Community rules violation'})});await refresh();notify(banned?`${member.username} was unbanned.`:`${member.username} was banned.`)}catch(e){notify(e.message);button.disabled=false}});$$('[data-member-mute]',root).forEach(button=>button.onclick=async()=>{const id=Number(button.dataset.memberMute),member=members.find(m=>m.id===id),muted=button.dataset.muted==='true';button.disabled=true;try{await api(`/api/users/${muted?'unmute':'mute'}`,{method:'POST',body:JSON.stringify({user_id:id,room_id:'*',minutes:60,reason:'Community rules violation'})});await refresh();notify(muted?`${member.username} was unmuted.`:`${member.username} was muted for one hour.`)}catch(e){notify(e.message);button.disabled=false}})}
function card(m){const [p1,p2,p3]=colors(m);return `<article class="manga-card" data-manga="${m.id}"><div class="cover" style="--p1:${p1};--p2:${p2};--p3:${p3}" data-mark="${esc(short(m.title))}"><span class="cover-tag">${esc(m.status)}</span><div class="cover-title">${esc(m.title)}</div></div><div class="card-body"><div class="card-author">${esc(m.author)} · ${esc(m.genres.split(',')[0])}</div><div class="card-foot"><span class="score">★ ${Number(m.rating||0).toFixed(1)} <span style="color:#9a9a91">(${m.review_count||0})</span></span><span>${m.chapters} chapters</span></div></div></article>`}
function bindCards(root){$$('[data-manga]',root).forEach(el=>el.onclick=()=>openManga(+el.dataset.manga))}
function catalogueManagerHTML(){if(!canEditCatalogue(state.user?.role))return '';const manga=state.manga||[];return `<details class="owner-notice catalog-manager" style="margin:0 0 20px"><summary style="cursor:pointer;font-weight:700">Manage fictional library <span style="font-weight:400">· owner and editor tools</span></summary><div class="catalog-layout" style="margin-top:14px"><form class="catalog-form" id="catalog-form"><div class="eyebrow">Add a manga</div><label>Title<input name="title" maxlength="120" required></label><label>Author<input name="author" maxlength="100" required></label><label>Genres<input name="genres" maxlength="180" placeholder="Action, Fantasy" required></label><label>Synopsis<textarea name="synopsis" maxlength="1800" required></textarea></label><label>Chapters<input name="chapters" type="number" min="1" max="100000" required></label><label>Status<select name="status"><option>Ongoing</option><option>Completed</option><option>Hiatus</option></select></label><button class="btn">Add manga</button></form><div class="catalog-list">${manga.length?manga.map(m=>`<div class="catalog-row"><div class="catalog-row-main"><b>${esc(m.title)}</b><small>${esc(m.author)} · ${esc(m.genres)} · ${Number(m.page_count||0)} pages uploaded</small></div><button class="member-action" data-manga-remove="${m.id}">Remove</button><form class="page-upload-form" data-page-upload="${m.id}"><label>Chapter<input name="chapter" type="number" min="1" max="${m.chapters}" value="1" required></label><label>Page images<input name="pages" type="file" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" multiple required></label><button class="btn small" type="submit">Upload pages</button><span class="page-upload-status" data-upload-status="${m.id}" aria-live="polite">JPEG, PNG, or WebP · up to 5 MB each · sort by filename</span></form><form class="page-upload-form" data-pdf-upload="${m.id}"><label>PDF chapter<input name="chapter" type="number" min="1" max="${m.chapters}" value="1" required></label><label>Chapter PDF<input name="pdf" type="file" accept=".pdf,application/pdf" required></label><button class="btn small" type="submit">Upload PDF</button><span class="page-upload-status" data-pdf-status="${m.id}" aria-live="polite">One PDF per chapter · up to 20 MB</span></form></div>`).join(''):'<div class="empty">Add a manga using the form above to unlock chapter page and PDF uploads.</div>'}</div></div></details>` }

d image</div><div class="event-dropzone-sub">Drag &amp; drop an image here, or click <strong>Add file</strong> to browse</div><button type="button" class="btn small" id="event-add-file-btn" style="margin-top:4px">📁 Add file</button><div class="event-dropzone-formats">JPEG, PNG, or WebP · Up to 5 MB</div></div><div id="event-preview-card" class="event-preview-card" hidden><div class="event-preview-thumb-wrap"><img id="event-preview-img" alt="Background preview" src=""><div class="event-preview-badge" id="event-preview-badge">Ready to apply</div></div><div class="event-preview-info"><div class="event-preview-name" id="event-preview-name"></div><div class="event-preview-meta" id="event-preview-meta"></div><div class="event-preview-actions"><button type="button" class="btn small light" id="event-change-file-btn">📁 Choose different file</button><button type="button" class="text-btn" id="event-clear-file-btn" style="color:var(--red);font-size:12px">Remove file</button></div></div></div><div class="event-note" id="event-image-status" style="margin-top:10px"></div></div><label>Fade duration<select id="event-transition-choice" name="transition_ms"><option value="1000">1 second</option><option value="3000">3 seconds</option><option value="6000">6 seconds</option><option value="12000">12 seconds</option></select></label><div class="event-note">This fades in the new background for all visitors and saves it to the site database.</div><button class="btn" id="event-save" type="submit">Start background event</button></form></section></div>`;const choice=$('#event-background-choice'),imageInput=$('#event-image-file'),imagePanel=$('#event-custom-panel'),dropzone=$('#event-dropzone'),previewCard=$('#event-preview-card'),previewImg=$('#event-preview-img'),previewBadge=$('#event-preview-badge'),previewName=$('#event-preview-name'),previewMeta=$('#event-preview-meta'),imageStatus=$('#event-image-status'),addFileBtn=$('#event-add-file-btn'),changeFileBtn=$('#event-change-file-btn'),clearF
